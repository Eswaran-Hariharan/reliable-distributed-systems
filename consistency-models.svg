<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
    <marker id="a2g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2e9e5b"/></marker>
  </defs>
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1a1d21">Consistency Models</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6572">When a write lands, when should the other replicas show it?</text>

  <!-- ===== STRONG ===== -->
  <rect x="30" y="84" width="740" height="150" rx="14" fill="#fcf7ff" stroke="#8a4fbf" stroke-width="1.8"/>
  <circle cx="58" cy="112" r="12" fill="#8a4fbf"/><text x="58" y="117" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">1</text>
  <text x="80" y="110" font-size="17" font-weight="800" fill="#6a2f9e">Strong Consistency</text>
  <text x="80" y="128" font-size="12" fill="#5a3a7a">Write blocks until every replica is updated. All reads then see the new value immediately.</text>

  <!-- client write -->
  <rect x="55" y="150" width="70" height="34" rx="7" fill="#fff" stroke="#8a4fbf"/><text x="90" y="171" text-anchor="middle" font-size="11" fill="#6a2f9e">Write X=10</text>
  <line x1="125" y1="167" x2="165" y2="167" stroke="#555" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="167" y="150" width="80" height="34" rx="7" fill="#f3e9fb" stroke="#8a4fbf" stroke-width="1.6"/><text x="207" y="171" text-anchor="middle" font-size="11" fill="#6a2f9e" font-weight="700">Primary</text>
  <!-- replicas all X=10 -->
  <g font-size="10.5" fill="#1f7a46">
    <rect x="300" y="146" width="90" height="26" rx="6" fill="#eafaf0" stroke="#2e9e5b"/><text x="345" y="163" text-anchor="middle">R1  X=10 ✔</text>
    <rect x="300" y="176" width="90" height="26" rx="6" fill="#eafaf0" stroke="#2e9e5b"/><text x="345" y="193" text-anchor="middle">R2  X=10 ✔</text>
    <rect x="300" y="206" width="90" height="26" rx="6" fill="#eafaf0" stroke="#2e9e5b"/><text x="345" y="223" text-anchor="middle">R3  X=10 ✔</text>
  </g>
  <line x1="247" y1="167" x2="298" y2="159" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#a2g)"/>
  <line x1="247" y1="167" x2="298" y2="189" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#a2g)"/>
  <line x1="247" y1="167" x2="298" y2="219" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#a2g)"/>
  <text x="420" y="160" font-size="11.5" fill="#444" font-weight="700">✔ Correctness  ✔ Simple to reason</text>
  <text x="420" y="178" font-size="11.5" fill="#b33">✘ Higher latency  ✘ Weaker availability on partition</text>
  <text x="420" y="204" font-size="11" fill="#666">Use: banking · payments · inventory · financial txns</text>

  <!-- ===== EVENTUAL ===== -->
  <rect x="30" y="246" width="740" height="150" rx="14" fill="#f7fbff" stroke="#2f6fb3" stroke-width="1.8"/>
  <circle cx="58" cy="274" r="12" fill="#2f6fb3"/><text x="58" y="279" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">2</text>
  <text x="80" y="272" font-size="17" font-weight="800" fill="#275e97">Eventual Consistency</text>
  <text x="80" y="290" font-size="12" fill="#2c5680">Write returns fast; replicas catch up over time. Reads may be briefly stale, then converge.</text>

  <rect x="55" y="312" width="70" height="34" rx="7" fill="#fff" stroke="#2f6fb3"/><text x="90" y="333" text-anchor="middle" font-size="11" fill="#275e97">Write X=10</text>
  <line x1="125" y1="329" x2="165" y2="329" stroke="#555" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="167" y="312" width="80" height="34" rx="7" fill="#e7f0fb" stroke="#2f6fb3" stroke-width="1.6"/><text x="207" y="333" text-anchor="middle" font-size="11" fill="#275e97" font-weight="700">Primary</text>
  <g font-size="10" >
    <rect x="300" y="308" width="104" height="26" rx="6" fill="#eafaf0" stroke="#2e9e5b"/><text x="352" y="325" text-anchor="middle" fill="#1f7a46">R1  X=10 (t+1s)</text>
    <rect x="300" y="338" width="104" height="26" rx="6" fill="#fff6e6" stroke="#d6a52f"/><text x="352" y="355" text-anchor="middle" fill="#9a6a12">R2  X=? (t+3s)</text>
    <rect x="300" y="368" width="104" height="26" rx="6" fill="#fdeeee" stroke="#d64545"/><text x="352" y="385" text-anchor="middle" fill="#b33">R3  stale (t+5s)</text>
  </g>
  <line x1="247" y1="329" x2="298" y2="321" stroke="#2f6fb3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <line x1="247" y1="329" x2="298" y2="351" stroke="#2f6fb3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <line x1="247" y1="329" x2="298" y2="381" stroke="#2f6fb3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <text x="430" y="322" font-size="11.5" fill="#444" font-weight="700">✔ High availability  ✔ Low latency  ✔ Scales</text>
  <text x="430" y="340" font-size="11.5" fill="#b33">✘ Reads can be temporarily stale</text>
  <text x="430" y="366" font-size="11" fill="#666">Use: social feeds · notifications · analytics · carts</text>

  <!-- ===== CAUSAL ===== -->
  <rect x="30" y="408" width="740" height="162" rx="14" fill="#f6fcf9" stroke="#2e9e5b" stroke-width="1.8"/>
  <circle cx="58" cy="436" r="12" fill="#2e9e5b"/><text x="58" y="441" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">3</text>
  <text x="80" y="434" font-size="17" font-weight="800" fill="#1f7a46">Causal Consistency</text>
  <text x="80" y="452" font-size="12" fill="#2b6b43">Preserves cause → effect ordering. If B depends on A, everyone sees A before B.</text>

  <!-- causal chain -->
  <rect x="60" y="474" width="78" height="32" rx="7" fill="#fff" stroke="#2e9e5b"/><text x="99" y="494" text-anchor="middle" font-size="10.5" fill="#1f7a46">C1: Write A</text>
  <line x1="138" y1="490" x2="172" y2="490" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="174" y="474" width="78" height="32" rx="7" fill="#fff" stroke="#2e9e5b"/><text x="213" y="494" text-anchor="middle" font-size="10.5" fill="#1f7a46">C2: Read A</text>
  <line x1="252" y1="490" x2="286" y2="490" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="288" y="474" width="78" height="32" rx="7" fill="#fff" stroke="#2e9e5b"/><text x="327" y="494" text-anchor="middle" font-size="10.5" fill="#1f7a46">C2: Write B</text>
  <text x="213" y="528" text-anchor="middle" font-size="11" fill="#2b6b43" font-weight="700">All replicas observe A before B</text>

  <text x="430" y="486" font-size="11.5" fill="#444" font-weight="700">✔ Preserves operation order</text>
  <text x="430" y="504" font-size="11.5" fill="#444">Stronger than eventual, lighter than strong</text>
  <text x="430" y="522" font-size="11" fill="#666">Use: comment/reply · collaborative apps ·</text>
  <text x="430" y="538" font-size="11" fill="#666">distributed workflows · dependent operations</text>

  <!-- footer takeaway -->
  <text x="400" y="596" text-anchor="middle" font-size="12.5" fill="#1a1d21" font-weight="700">Strong = Correctness   ·   Eventual = Availability + Scale   ·   Causal = Correct Order</text>
  <text x="400" y="620" text-anchor="middle" font-size="11.5" fill="#b35b00">💡 Ask "what if a user reads stale data?" — the answer picks the model, not the technology.</text>
</svg>
